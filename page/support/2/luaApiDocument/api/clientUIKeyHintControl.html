<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>星々の学び舎</title>

    <link rel="stylesheet" href="../../../../../css/style.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="navbar-content">
        <a href="../../../../../index.html" class="site-title">星々の学び舎</a>

        <div class="menu">
          <a href="../../../../../page/beginner/">初心者向け</a>
          <a href="../../../../../page/guide/">ガイド</a>
          <a href="../../../../../page/event/">イベント関連</a>
          <a href="../../../../../page/support/">開発サポート</a>
        </div>
      </div>
    </nav>

    <div class="layout">
      <div id="menu" class="sidebar"></div>

      <main class="content">
        <section class="section">
          <h2>⭐ClientUIKeyHintControl</h2>
          <div class="content-box">
            現在の入力デバイスに応じて、対応するキーを表示します。
          </div>
          <h3>🌸フィールド</h3>
          <table class="doc-table">
            <thead>
              <tr>
                <th>フィールド名</th>
                <th>型</th>
                <th>アクセス</th>
                <th>内容</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>keyboardKeyCode</td>
                <td>KeyboardKeyCode</td>
                <td>読み書き可能</td>
                <td>キーボード・マウスのキー列挙値</td>
              </tr>
              <tr>
                <td>controllerKeyCode</td>
                <td>ControllerKeyCode</td>
                <td>読み書き可能</td>
                <td>コントローラー（パッド）のボタン列挙値</td>
              </tr>
            </tbody>
          </table>
        </section>
      </main>
    </div>

    <script>
      fetch("/page/support/2/luaApiDocument/menu.html")
        .then((r) => r.text())
        .then((html) => {
          document.getElementById("menu").innerHTML = html;

          document.querySelectorAll("details").forEach((details) => {
            const summary = details.querySelector("summary");
            const key = "menu-" + summary.textContent.trim();

            const state = localStorage.getItem(key);

            if (state !== null) {
              details.open = state === "open";
            }

            details.addEventListener("toggle", () => {
              localStorage.setItem(key, details.open ? "open" : "closed");
            });
          });

          const current = window.location.pathname;

          document.querySelectorAll("#menu a").forEach((link) => {
            const url = new URL(link.href);

            if (url.pathname === current) {
              link.classList.add("active");
            }
          });
        });
    </script>

    <footer>© 2026 星々の学び舎.</footer>
    <script src="../../../../../js/style.js"></script>
  </body>
</html>
