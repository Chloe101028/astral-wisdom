<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>星々の学び舎</title>

    <link rel="stylesheet" href="../../../../../css/style.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="navbar-content">
        <a href="../../../../../index.html" class="site-title">星々の学び舎</a>

        <div class="menu">
          <a href="../../../../../page/beginner/">初心者向け</a>
          <a href="../../../../../page/guide/">ガイド</a>
          <a href="../../../../../page/event/">イベント関連</a>
          <a href="../../../../../page/support/">開発サポート</a>
        </div>
      </div>
    </nav>

    <div class="layout">
      <div id="menu" class="sidebar"></div>

      <main class="content">
        <section class="section">
          <h2>⭐フレーム単位の制御</h2>
          <div class="content-box">script:EnableUpdate(enabled: boolean)</div>
          3-1.スクリプトのライフサイクルの「OnUpdate(dt)」と「OnLevelUpdate(dt)」の呼び出しを停止します。<br /><br />
          ・false<br />→フレーム更新を停止<br />・true<br />→フレーム更新を再開<br /><br />
          ※60FPSであれば、1秒間に60回もの更新処理が呼ばれることになります。<br />
          　フレーム更新を呼ぶ必要のない時は、呼び出しを停止することでパフォーマンスの向上に繋がります。
        </section>
      </main>
    </div>

    <script>
      fetch("../menu.html")
        .then((r) => r.text())
        .then((html) => {
          document.getElementById("menu").innerHTML = html;

          document.querySelectorAll("details").forEach((details) => {
            const summary = details.querySelector("summary");
            const key = "menu-" + summary.textContent.trim();

            const state = localStorage.getItem(key);

            if (state !== null) {
              details.open = state === "open";
            }

            details.addEventListener("toggle", () => {
              localStorage.setItem(key, details.open ? "open" : "closed");
            });
          });

          const current = window.location.pathname;

          document.querySelectorAll("#menu a").forEach((link) => {
            const url = new URL(link.href);

            if (url.pathname === current) {
              link.classList.add("active");
            }
          });
        });
    </script>

    <footer>© 2026 星々の学び舎.</footer>
    <script src="../../../../../js/style.js"></script>
  </body>
</html>
